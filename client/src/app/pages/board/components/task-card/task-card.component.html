<button class="btn-delete-task" title="Xóa thẻ" (click)="onDelete($event)">
  <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
    <path
      fill-rule="evenodd"
      d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
      clip-rule="evenodd"
    />
  </svg>
</button>
<div class="task-labels">
  @for (label of task.labels; track label.id) {
    <span
      class="label"
      [style.color]="label.color"
      [style.backgroundColor]="label.color + '25'"
      >{{ label.name }}</span
    >
  }
</div>

<p class="task-title">{{ task.title }}</p>
@if (task.assigneeName) {
  <div class="task-footer">
    <div class="assignee-chip">
      <span class="chip-avatar">{{ task.assigneeName.substring(0, 1).toUpperCase() }}</span>
      <span class="chip-name">{{ task.assigneeName }}</span>
    </div>
  </div>
}
