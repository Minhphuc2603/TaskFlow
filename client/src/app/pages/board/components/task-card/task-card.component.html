<button class="btn-delete-task" title="Xóa thẻ" (click)="onDelete($event)">
  <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
  </svg>
</button>
<div class="task-labels">
  @for (label of task.labels; track label.id) {
    <span class="label" [style.color]="label.color" [style.backgroundColor]="label.color + '25'">{{ label.name }}</span>
  }
</div>

<p class="task-title">{{ task.title }}</p>

@if (task.description) {
  <p class="task-desc">{{ task.description }}</p>
}

<div class="task-footer">
  <div class="footer-left">

    @if (task.commentCount > 0) {
      <span class="comments">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/>
        </svg>
        {{ task.commentCount }}
      </span>
    }
  </div>
  <div class="footer-right">
      @if (task.assigneeName) {
        <div class="assignee-avatar" [title]="task.assigneeName">
          {{ task.assigneeName.substring(0, 1) }}
        </div>
      }
  </div>
</div>
