<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <img src="assets/Logo.png" alt="TaskFlow" width="180" />
      </div>
      <h1>Chào mừng trở lại</h1>
      <p>Đăng nhập để tiếp tục với TaskFlow</p>
    </div>

    <form (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <div class="error-message">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v3a.75.75 0 01-1.5 0V5zm.75 6.5a1 1 0 110-2 1 1 0 010 2z"
            />
          </svg>
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          Đang đăng nhập...
        } @else {
          Đăng nhập
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Chưa có tài khoản? <a routerLink="/register">Tạo tài khoản</a></p>
    </div>
  </div>
</div>
