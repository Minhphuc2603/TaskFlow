<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="url(#gradient)"/>
          <path d="M12 14h16v3H12zM12 20h10v3H12zM12 26h14v3H12z" fill="white"/>
          <defs>
            <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
              <stop stop-color="#6366f1"/>
              <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>Chào mừng trở lại</h1>
      <p>Đăng nhập để tiếp tục với TaskFlow</p>
    </div>

    <form (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <div class="error-message">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v3a.75.75 0 01-1.5 0V5zm.75 6.5a1 1 0 110-2 1 1 0 010 2z"/>
          </svg>
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          Đang đăng nhập...
        } @else {
          Đăng nhập
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Chưa có tài khoản? <a routerLink="/register">Tạo tài khoản</a></p>
    </div>
  </div>
</div>
